version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-v2-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: finance_v2
    volumes:
      - finance_pg_data:/var/lib/postgresql/data

volumes:
  finance_pg_data:
